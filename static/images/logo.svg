<?xml version="1.0" encoding="UTF-8"?>
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Circle -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#6C3CE9" stroke-width="3"/>
  
  <!-- Inner Circle -->
  <circle cx="50" cy="50" r="8" fill="#6C3CE9"/>
  
  <!-- Compass Needle - North/South -->
  <path d="M50,15 L54,50 L50,50 L46,50 Z" fill="#FF6B35" />
  <path d="M50,85 L54,50 L50,50 L46,50 Z" fill="#05CDFA" />
  
  <!-- Compass Needle - East/West -->
  <path d="M15,50 L50,46 L50,50 L50,54 Z" fill="#05CDFA" />
  <path d="M85,50 L50,46 L50,50 L50,54 Z" fill="#FF6B35" />
  
  <!-- Cardinal Direction Indicators -->
  <text x="50" y="12" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#6C3CE9">N</text>
  <text x="50" y="93" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#6C3CE9">S</text>
  <text x="93" y="53" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#6C3CE9">E</text>
  <text x="7" y="53" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#6C3CE9">W</text>
  
  <!-- Decorative Tick Marks -->
  <path d="M50,5 L50,10" stroke="#6C3CE9" stroke-width="2" />
  <path d="M50,90 L50,95" stroke="#6C3CE9" stroke-width="2" />
  <path d="M5,50 L10,50" stroke="#6C3CE9" stroke-width="2" />
  <path d="M90,50 L95,50" stroke="#6C3CE9" stroke-width="2" />
  
  <!-- Diagonal Tick Marks -->
  <path d="M25,25 L28,28" stroke="#6C3CE9" stroke-width="2" />
  <path d="M75,25 L72,28" stroke="#6C3CE9" stroke-width="2" />
  <path d="M25,75 L28,72" stroke="#6C3CE9" stroke-width="2" />
  <path d="M75,75 L72,72" stroke="#6C3CE9" stroke-width="2" />
</svg>